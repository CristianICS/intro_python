    - chapters/04_python_basics.qmd
    - chapters/05_scripting.qmd
    - chapters/06_vectors.qmd
  downloads: [pdf]

bibliography: references.bib

format:
  html:
    theme: default
    toc-expand: 3
  pdf:
    template: eisvogel.latex
    linkcolor: cyan
    urlcolor: cyan