  callout-warning-title: "Advertencia"
  callout-tip-title: "Consejo"

book:
  title: "Programación para el análisis espacial: Python"
  author: Cristian Iranzo
  publisher: "Máster Universitario en Ciencia y Tecnología de la Información Geográfica (CTIG)"
  sidebar:
    logo: images/book/logo_unizar.svg
  navbar:
    logo: images/book/logo_python.svg
    background: "#212529"
    foreground: white
  chapters:
    - index.qmd
    - chapters/01_introduction.qmd
    - chapters/02_installation.qmd
